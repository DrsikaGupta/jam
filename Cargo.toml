[package]
name = "jam"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
rodio = "0.21"
rfd = "0.15"
sha2 = "0.10"
hex = "0.4"
lofty = "0.22"
image = "0.25"
ratatui-image = "8"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
crossbeam-channel = "0.5"
rand = "0.9"
strsim = "0.11"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
bytes = "1"